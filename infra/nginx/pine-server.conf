# PINE Web Radio — Production Nginx Config
# Place this file in /etc/nginx/sites-available/pine
# Then symlink: sudo ln -s /etc/nginx/sites-available/pine /etc/nginx/sites-enabled/pine
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

upstream pine_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream pine_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name pine.evergreen-explorers.online;

    client_max_body_size 200m;

    # Health check endpoint
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API endpoints
    location /api/ {
        proxy_pass http://pine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://pine_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://pine_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
